<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generate API Key</title>
<style>
  body {
    font-family: Verdana, Arial, sans-serif;
    background: #f4f4f8;
    color: #333;
    padding: 30px 20px 60px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.3rem;
    color: #222;
  }
  h2 {
    font-size: 1rem;
    color: #0f8a7e;
    margin: 0 0 6px;
  }
  .box {
    background: #fff;
    border: 1px solid #e0e0e8;
    border-radius: 14px;
    padding: 20px;
    margin-top: 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.9rem;
    color: #555;
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    box-sizing: border-box;
    background: #fafafc;
    color: #222;
    border: 1px solid #d5d5e0;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #0f8a7e;
  }
  button {
    margin-top: 12px;
    padding: 10px 18px;
    background: #0f8a7e;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover {
    background: #0c7268;
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  code {
    display: block;
    word-break: break-all;
    background: #f4f4f8;
    border: 1px solid #d5d5e0;
    border-radius: 8px;
    padding: 10px;
    margin-top: 10px;
    color: #0f8a7e;
  }
  .copybtn {
    background: #0f8a7e;
    margin-top: 8px;
  }
  .copybtn:hover {
    background: #0c7268;
  }
  .error {
    color: #b3261e;
    background: #fdecea;
    border: 1px solid #f3c3bf;
    border-radius: 8px;
    padding: 10px 14px;
    margin-top: 14px;
    display: none;
  }
  .warn {
    font-size: 0.82rem;
    color: #b06a1a;
    background: #fff6e8;
    border: 1px solid #f0d9a8;
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 12px;
  }
  a {
    color: #0f8a7e;
    text-decoration: none;
    font-size: 0.9rem;
  }
  a:hover {
    text-decoration: underline;
  }
  .key-entry {
    border: 1px solid #e0e0e8;
    border-radius: 10px;
    padding: 12px 14px;
    margin-top: 10px;
  }
  .key-entry:first-child {
    margin-top: 0;
  }
  .key-entry .key-name {
    font-weight: 600;
    color: #222;
    font-size: 0.92rem;
  }
  .key-entry .key-date {
    font-size: 0.75rem;
    color: #999;
    margin-left: 6px;
  }
  .key-entry code {
    margin-top: 6px;
    font-size: 0.82rem;
    padding: 6px 8px;
  }
  .key-entry-actions {
    margin-top: 6px;
    display: flex;
    gap: 8px;
  }
  .key-entry-actions button {
    margin-top: 0;
    padding: 6px 12px;
    font-size: 0.8rem;
  }
  .removebtn {
    background: #fff;
    color: #b3261e;
    border: 1px solid #f3c3bf;
  }
  .removebtn:hover {
    background: #fdecea;
  }
  .empty-note {
    color: #999;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <h1>Generate API Key</h1>
  <p>Pick a username for this key (e.g. what device or browser it's for), then generate it.</p>

  <div class="box">
    <label for="username">Username</label>
    <input type="text" id="username" maxlength="32" placeholder="e.g. my-project">
    <button id="genBtn" onclick="generateKey()">Generate Key</button>
  </div>

  <p class="error" id="err"></p>

  <div class="box" id="result" style="display:none;">
    <strong>Your API key</strong>
    <code id="keyOut"></code>
    <button class="copybtn" onclick="copyKey()">Copy</button>
    <div class="warn">Save this now — it won't be shown again. Paste it into the extension's settings.</div>
  </div>

  <div class="box">
    <h2>Your saved keys</h2>
    <p class="empty-note" id="emptyNote">No keys generated on this device yet.</p>
    <div id="keyList"></div>
  </div>

  <p style="margin-top:18px;"><a href="docs.html">&larr; back to docs</a></p>

<script>
const STORAGE_KEY = 'ikelene_storage_api_keys';

function loadKeys() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (e) {
    return [];
  }
}

function saveKeys(keys) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(keys));
}

function renderKeys() {
  const keys = loadKeys();
  const list = document.getElementById('keyList');
  const emptyNote = document.getElementById('emptyNote');
  list.innerHTML = '';

  if (keys.length === 0) {
    emptyNote.style.display = 'block';
    return;
  }
  emptyNote.style.display = 'none';

  keys.slice().reverse().forEach((entry) => {
    const div = document.createElement('div');
    div.className = 'key-entry';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'key-name';
    nameSpan.textContent = entry.username;

    const dateSpan = document.createElement('span');
    dateSpan.className = 'key-date';
    dateSpan.textContent = new Date(entry.createdAt).toLocaleDateString();

    const codeEl = document.createElement('code');
    codeEl.textContent = entry.apiKey;

    const actions = document.createElement('div');
    actions.className = 'key-entry-actions';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copybtn';
    copyBtn.textContent = 'Copy';
    copyBtn.onclick = () => navigator.clipboard.writeText(entry.apiKey);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'removebtn';
    removeBtn.textContent = 'Remove';
    removeBtn.onclick = () => removeKey(entry.apiKey);

    actions.appendChild(copyBtn);
    actions.appendChild(removeBtn);

    div.appendChild(nameSpan);
    div.appendChild(dateSpan);
    div.appendChild(codeEl);
    div.appendChild(actions);
    list.appendChild(div);
  });
}

function removeKey(apiKey) {
  const keys = loadKeys().filter(k => k.apiKey !== apiKey);
  saveKeys(keys);
  renderKeys();
}

async function generateKey() {
  const btn = document.getElementById('genBtn');
  const username = document.getElementById('username').value.trim();
  const errBox = document.getElementById('err');
  const result = document.getElementById('result');
  errBox.style.display = 'none';
  result.style.display = 'none';

  if (!username) {
    errBox.textContent = 'Enter a username first.';
    errBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Generating...';

  try {
    const res = await fetch('createApiKey.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username })
    });
    const data = await res.json();
    if (!data.success) {
      throw new Error(data.error || 'unknown_error');
    }
    document.getElementById('keyOut').textContent = data.apiKey;
    result.style.display = 'block';

    const keys = loadKeys();
    keys.push({ username: data.username, apiKey: data.apiKey, createdAt: Date.now() });
    saveKeys(keys);
    renderKeys();
    document.getElementById('username').value = '';
  } catch (e) {
    errBox.textContent = 'Failed to generate key: ' + e.message;
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate Key';
  }
}

function copyKey() {
  navigator.clipboard.writeText(document.getElementById('keyOut').textContent);
}

renderKeys();
</script>
</body>
</html>
